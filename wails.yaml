# yaml-language-server: $schema=https://v3.wails.io/schemas/wails.v3.json
version: 3
project:
  name: dailyflow
  product_name: DailyFlow
  identifier: com.dailyflow.app
  version: 0.3.0
frontend:
  directory: frontend
  install: [npm, install]
  build: [npm, run, build]
  dev: [npm, run, dev]
  output: dist
  bindings:
    typescript: false
    interfaces: false
    output: bindings
build:
  output: build/bin
